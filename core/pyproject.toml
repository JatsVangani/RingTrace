[project]
name = "ringtrace-core"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "falkordb",
    "redis>=8.1.0",
    "openai>=3.35.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ringtrace_core"]
