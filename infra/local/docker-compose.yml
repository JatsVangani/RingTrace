services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    ports:
      - "6379:6379"   # database
      - "3000:3000"   # browser UI
    environment:
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT_DEFAULT 30000 TIMEOUT_MAX 120000 RESULTSET_SIZE 10000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:f41d47eee678c02656eefc9ed8cce76cab584aa7032805eeef0e6639fcfda485
    command: ["-hf", "Qwen/Qwen3-8B-GGUF:Q4_K_M", "--jinja", "-c", "4096",
              "--host", "0.0.0.0", "--port", "8080"]
    environment:
      LLAMA_CACHE: /models
    ports: ["8080:8080"]
    volumes: [llm-models:/models]

volumes:
  falkordb-data:
  llm-models: