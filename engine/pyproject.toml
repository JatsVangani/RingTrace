[project]
name = "ringtrace-engine"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ringtrace-core",
    "polars",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ringtrace_engine"]

[tool.uv.sources]
ringtrace-core = { workspace = true }