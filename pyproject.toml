[project]
name = "ringtrace"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ringtrace-core",
    "ringtrace-engine",
    "ringtrace-agent",
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "engine", "agent"]

[tool.uv.sources]
ringtrace-core = { workspace = true }
ringtrace-engine = { workspace = true }
ringtrace-agent = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]