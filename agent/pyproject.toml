[project]
name = "ringtrace-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ringtrace-core",
    "ringtrace-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ringtrace_agent"]

[tool.uv.sources]
ringtrace-core = { workspace = true }
ringtrace-engine = { workspace = true }